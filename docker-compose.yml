services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smscredit
      POSTGRES_PASSWORD: smscredit
      POSTGRES_DB: smscredit
    ports:
      - "5432:5432"
    volumes:
      - smscredit_pg:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  smscredit_pg:
